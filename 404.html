<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page not found - The Anh Nguyen</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f7f4ee;
      --text:  #1c1a14;
      --muted: #7a7060;
      --accent:#2563eb;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .code { font-family: 'Caveat', cursive; font-size: 8rem; line-height: 1; letter-spacing: -0.02em; }
    h1 { font-family: 'Caveat', cursive; font-size: 2.4rem; font-weight: 600; margin-top: 8px; }
    p { color: var(--muted); margin-top: 12px; font-size: 1rem; }
    a { color: var(--accent); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>

  <script async src="/analytics.js"></script>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That page doesn't exist. <a href="/">Back to homepage</a>.</p>
  </main>
</body>
</html>
